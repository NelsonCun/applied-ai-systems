services:
  db:
    image: postgres:16-alpine
    container_name: smartinvoice-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartinvoice-network

  redis:
    image: redis:7-alpine
    container_name: smartinvoice-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartinvoice-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    container_name: smartinvoice-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smartinvoice-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    container_name: smartinvoice-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.tasks.celery_app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rpa-target:
        condition: service_healthy
    networks:
      - smartinvoice-network

  rpa-target:
    build:
      context: ./rpa-target
      dockerfile: Dockerfile
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    container_name: smartinvoice-rpa-target
    restart: unless-stopped
    environment:
      RPA_USERNAME: ${RPA_USERNAME}
      RPA_PASSWORD: ${RPA_PASSWORD}
      RPA_DATABASE_PATH: /data/rpa_target.db
    volumes:
      - rpa_target_data:/data
    ports:
      - "8082:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/health > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - smartinvoice-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartinvoice-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8001/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartinvoice-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: smartinvoice-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - smartinvoice-network

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  rpa_target_data:

networks:
  smartinvoice-network:
    driver: bridge
